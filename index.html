<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Trainer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>App Trainer</h1>
    <nav>
      <button data-tab="workouts" class="active">Treinos</button>
      <button data-tab="run">Treinar</button>
      <button data-tab="history">Histórico</button>
      <button data-tab="cloud">Nuvem</button>
    </nav>
  </header>

  <main>
    <section id="workouts" class="tab active">
      <div class="card">
        <h2>Novo treino</h2>
        <input id="workoutName" placeholder="Nome do treino">
        <button id="createWorkout">Criar treino</button>
        <button id="addPresets">Adicionar treinos Full Body A-E</button>
      </div>
      <div id="workoutList"></div>
    </section>

    <section id="run" class="tab">
      <div class="card">
        <label for="selectWorkout">Escolha o treino</label>
        <select id="selectWorkout"></select>
        <button id="startWorkout">Iniciar treino</button>
      </div>

      <div id="runner" class="hidden">
        <div class="card">
          <h2 id="currentExercise"></h2>
          <p id="currentInfo"></p>
          <div id="timer">00:00</div>
          <p id="timerLabel">Tempo do exercício</p>
          <div class="run-buttons">
            <button id="toggleTimer">Iniciar tempo</button>
            <button id="completeSet">Série concluída</button>
            <button id="skipExercise">Próximo exercício</button>
            <button id="finishWorkout">Finalizar</button>
          </div>
        </div>

        <div id="restCard" class="card hidden">
          <h2>Descanso</h2>
          <div id="restTimer">00:00</div>
          <button id="skipRest">Pular descanso</button>
        </div>
      </div>
    </section>

    <section id="history" class="tab">
      <div class="card">
        <h2>Histórico</h2>
        <button id="clearHistory">Limpar histórico</button>
      </div>
      <div id="historyList"></div>
    </section>

    <section id="cloud" class="tab">
      <div class="card">
        <h2>Conta na nuvem</h2>
        <input id="authEmail" type="email" placeholder="E-mail">
        <input id="authPassword" type="password" placeholder="Senha">
        <button id="loginButton">Entrar</button>
        <button id="signupButton">Criar conta</button>
        <button id="logoutButton" class="hidden">Sair</button>
        <button id="testConnection">Testar conexão</button>
        <p id="authStatus">Carregando...</p>
      </div>

      <div class="card">
        <h2>Sincronização</h2>
        <button id="saveCloud">Salvar na nuvem</button>
        <button id="loadCloud">Carregar da nuvem</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
